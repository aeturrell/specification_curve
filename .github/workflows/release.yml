name: Release

# On every push to main:
# - if the version in pyproject.toml changed, tag it, publish it to PyPI, publish
#   the release notes and the docs;
# - otherwise, publish a developmental release (next patch version plus
#   .dev<timestamp>) to TestPyPI and check that the docs build.

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  UV_VERSION: "0.9.17"
  PYTHON_VERSION: "3.12"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version tag and publish the release notes
      pull-requests: read # release-drafter reads merged pull requests
    outputs:
      tag: ${{ steps.check-version.outputs.tag }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          # never restore a cache in the job that builds what is published
          enable-cache: false

      - name: Check if there is a parent commit
        id: check-parent-commit
        run: echo "sha=$(git rev-parse --verify --quiet HEAD^)" >> "$GITHUB_OUTPUT"

      - name: Detect and tag new version
        id: check-version
        if: steps.check-parent-commit.outputs.sha
        uses: salsify/action-detect-and-tag-new-version@v2.0.3
        with:
          version-command: uv version --short

      - name: Bump version for developmental release
        if: ${{ ! steps.check-version.outputs.tag }}
        run: uv version --bump patch --bump "dev=$(date +%s)" --frozen

      - name: Build package
        run: uv build

      - name: Publish package on PyPI
        if: steps.check-version.outputs.tag
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}

      - name: Publish package on TestPyPI
        if: ${{ ! steps.check-version.outputs.tag }}
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_TOKEN }}
          repository-url: https://test.pypi.org/legacy/

      - name: Publish the release notes
        uses: release-drafter/release-drafter@v7.10.0
        with:
          publish: ${{ steps.check-version.outputs.tag != '' }}
          tag: ${{ steps.check-version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Docs
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the site to the gh-pages branch
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9

      - name: Build docs
        run: uv run --frozen great-docs build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish docs
        if: needs.release.outputs.tag
        working-directory: great-docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --frozen quarto publish gh-pages --no-render --no-browser
