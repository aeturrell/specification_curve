[project]
name = "specification_curve"
version = "0.4.0"
description = "Specification curve analysis for econometrics, built on pyfixest"
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.4.2",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "pyfixest>=0.70",
    "scipy>=1.13",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "coverage>=7.6.9",
    "ipykernel>=6.29.5",
    "nbstripout>=0.8.1",
    "nox>=2024.10.9",
    "pandas-stubs>=2.2.2.240807",
    "pre-commit-hooks>=5.0.0",
    "pre-commit>=4.0.1",
    "pytest>=8.3.4",
    "ruff>=0.8.4",
    "toml>=0.10.2",
    "types-setuptools>=75.6.0.20241223",
    "xdoctest>=1.2.0",
    "aquarel>=0.0.6",
    "pydoclint>=0.6.0",
    "ty>=0.0.8",
    "typeguard>=4.4.1",
    "types-tqdm>=4.67.0.20241221",
    "great-docs>=0.17.0",
    "panache-cli>=3.17.2",
]

[tool.ty.rules]

[tool.ty.src]
exclude = ["tests/", "docs/logo.py"]

[tool.pytest.ini_options]
markers = ["slow: tests that re-estimate many curves"]

[tool.coverage.report]
show_missing = true
fail_under = 98

[tool.coverage.run]
branch = true
source = ["specification_curve"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.setuptools.packages.find]
where = ['src']
exclude = ['.gitignore']

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
specification_curve=['*.csv']

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.pydoclint]
style = 'google'
exclude = ["noxfile.py", "tests/", "docs/"]
